<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AWE Electronics - Online" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css" />
    <title>AWE Electronics - Online</title>
</head>

<body>
    <section id="header">
         <a href="home.html">
            <img src="assets/logo.png" alt="AWE Electronics Logo" />
        </a>



        <div>
            <ul id="navbar">
                <li><a href="cart.html"><i class="fa-solid fa-cart-shopping" style="font-size:48px;color:rgb(232, 208, 51)"></i></a></li>
                <li id="login-section">
                    <a href="login.html" class="login-button" id="login-button">Sign In</a>
                </li>
            </ul>
        </div>
    </section>

    <section id="welcome">
        <h4>New Offer Available</h4>
        <h1>Best Deals For Electronics Product</h1>
        <p>Save up to 30% off with coupons</p>
        <button onclick="location.href='#featured'">Explore Featured Products</button>
    </section>

    <section id="featured">
        <h1>Featured Products</h1>
        <p>Shop Most Popular Products Here</p>
        <div class="product-container"></div>
    </section>

    <section id="all">   
        <h1>Browse our catalogue</h1>
        <p>Everything at your service</p>
        <div class="filter-section">
            <p id="results"></p>
            <input type="text" id="product-search" placeholder="Search Product">
        </div>
        <div class="all-products-container"></div>
    </section>

    <footer>
        <p>SWE30003 Assignment 3</p>
        <p>Contributors: Thanh Tai Tran, Sabri Bayanta, Inder Singh, Ethan Ly</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
