<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AWE Electronics - Online" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css" />
    <title>AWE Electronics - Online</title>
</head>

<body>
    <section id="header">
        <a href="home.html">
            <img src="assets/logo.png" alt="AWE Electronics Logo" />
        </a>

        <div>
            <ul id="navbar">
                <li><a href="cart.html"><i class="fa-solid fa-cart-shopping" style="font-size:48px;color:rgb(232, 208, 51)"></i></a></li>
                <li id="login-section">
                    <!-- This section will be replaced by JavaScript based on login status -->
                    <a href="login.html" class="login-button" id="login-button">Sign In</a>
                </li>
            </ul>
        </div>
    </section>

    <section id="welcome">
        <h4>New Offer Available</h4>
        <h1>Best Deals For Electronics Product</h1>
        <p>Save up to 30% off with coupons</p>
        <button>Explore Featured Products</button>
    </section>

    <section id="featured">
        <h1>Featured Products</h1>
        <p>Shop Most Popular Products Here</p>
        <div class="product-container"></div>
    </section>

    <!-- Add this script to check for login status and update the navbar -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Check if user is logged in
            const isLoggedIn = sessionStorage.getItem('loggedIn');
            const username = sessionStorage.getItem('username');
            
            if (isLoggedIn === 'true' && username) {
                // User is logged in, replace login button with account image
                const loginSection = document.getElementById('login-section');
                
                // Create account section with image and username
                loginSection.innerHTML = `
                    <div style="display: flex; align-items: center;">
                        <img src="assets/account.png" alt="Account" style="height: 48px; width: auto;">
                        <span style="color: rgb(232, 208, 51); margin-left: 8px;">${username}</span>
                        <a href="#" id="logout-button" style="margin-left: 10px; color: rgb(232, 208, 51); font-size: 16px;">(Logout)</a>
                    </div>
                `;
                
                // Add logout functionality
                document.getElementById('logout-button').addEventListener('click', function(e) {
                    e.preventDefault();
                    // Clear session storage
                    sessionStorage.removeItem('loggedIn');
                    sessionStorage.removeItem('username');
                    // Reload the page to show login button again
                    window.location.reload();
                });
            }
        });
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
