<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AWE Electronics - Online" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <title>AWE Electronics - Online</title>
</head>
<body>

  <section id="header">
    <a href="home.html">
      <img src="assets/logo.png" alt="AWE Electronics Logo" />
    </a>
    <div>
      <ul id="navbar">
        <li>
          <a href="cart.html">
            <i class="fa-solid fa-cart-shopping" style="font-size:48px; color:rgb(232, 208, 51)"></i>
          </a>
        </li>
        <li><a href="login.html" class="login-button">Sign In</a></li>
      </ul>
    </div>
  </section>

  <section id="checkout-page">
    <h2>Checkout</h2>

    <div class="order-summary">
      <h3>Your Order</h3>
      <div id="order-items"></div>
      <p><strong>Total: $<span id="order-total">0.00</span></strong></p>
    </div>

    <div class="payment-section">
      <h3>Payment Details</h3>

      <form id="checkout-form">
        <label>
          Name on Card:
          <input type="text" id="card-name" placeholder="John Pork" />
        </label>
        <label>
          Card Number:
          <input type="text" id="card-number" placeholder="XXXX XXXX XXXX XXXX" maxlength="16" />
        </label>
        <label>
          Expiry Date:
          <input type="text" id="card-expiry" placeholder="MM/YY" />
        </label>
        <label>
          CVV:
          <input type="text" id="card-cvv" placeholder="XXX" maxlength="4" />
        </label>

        <h3>Shipping Address</h3>

        <label>
          Country:
          <input type="text" id="shipping-country" placeholder="Australia" />
        </label>
        <label>
          Full Name:
          <input type="text" id="shipping-first-name" placeholder="John" />
        </label>
        <label>
          Last Name:
          <input type="text" id="shipping-last-name" placeholder="Pork" />
        </label>
        <label>
          Address Line 1:
          <input type="text" id="shipping-address-1" placeholder="123 Main St" />
        </label>
        <label>
          Address Line 2 (Optional):
          <input type="text" id="shipping-address-2" placeholder="Apt 4B" />
        </label>
        <label>
          City:
          <input type="text" id="shipping-city" placeholder="Melbourne" />
        </label>
        <label>
          State/Province:
          <input type="text" id="shipping-state-province" placeholder="VIC" />
        </label>
        <label>
          Zip/Postal Code:
          <input type="text" id="shipping-zip-postal" placeholder="3000" />
        </label>
        <label>
          Phone Number (Optional):
          <input type="tel" id="shipping-phone" placeholder="04XX XXX XXX" />
        </label>

        <button type="submit" class="order-button">Place Order</button>
      </form>
    </div>
  </section>

  <script type="module" src="js/checkoutPage.js"></script>
</body>
</html>
