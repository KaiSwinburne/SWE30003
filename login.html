<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Account Registration & Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
</head>
<body class="p-4">
  <div class="container">
    <h1 class="text-center mb-4">Account Portal</h1>
    
    <div id="account-section">
      <form id="registerForm" class="mb-5">
        <h2>Create Account</h2>
        <div class="mb-3">
          <label for="regUsername" class="form-label">Username</label>
          <input type="text" class="form-control" id="regUsername" required />
        </div>
        <div class="mb-3">
          <label for="regPassword" class="form-label">Password</label>
          <input type="password" class="form-control" id="regPassword" required />
        </div>
        <div class="mb-3">
          <label for="regConfirm" class="form-label">Confirm Password</label>
          <input type="password" class="form-control" id="regConfirm" required />
        </div>
        <button type="submit" class="btn btn-primary">Register</button>
        <div id="registerMsg" class="mt-2"></div>
      </form>

      <form id="loginForm">
        <h2>Login</h2>
        <div class="mb-3">
          <label for="loginUsername" class="form-label">Username</label>
          <input type="text" class="form-control" id="loginUsername" required />
        </div>
        <div class="mb-3">
          <label for="loginPassword" class="form-label">Password</label>
          <input type="password" class="form-control" id="loginPassword" required />
        </div>
        <button type="submit" class="btn btn-success">Login</button>
        <div id="loginMsg" class="mt-2"></div>
      </form>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
